const $ = id => document.getElementById(id);
const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
let position = 0, playing = false, started = false, previous = 0;
const clamp = n => Math.min(1, Math.max(0,n));
const ease = n => { n = clamp(n); return n*n*(3-2*n); };
const mix = (a,b,n) => a+(b-a)*n;
function render(t) {
  let scale, x, y;
  // 0-7s: the push separates the woman from her abandoned throne, revealing her offered palm.
  if(t < 7) { const n=ease(t/7); scale=mix(1.16,1.29,n); x=mix(800,844,n); y=mix(350,365,n); }
  // 7-10s: the crash is motivated by ignition; settle quickly, giving the gesture time to read.
  else if(t < 10) { const n=1-Math.pow(1-clamp((t-7)/1.5),3); scale=mix(1.29,2.75,n); x=mix(844,959,n); y=mix(365,421,n); }
  // 10-19s: a completely locked portrait. Breath, hair and fire carry the refusal.
  else if(t < 19) { scale=2.75; x=959; y=421; }
  // 19-30s: widening reveals the broken scepter and a warm fissure spreading beyond her feet.
  else { const n=ease((t-19)/9); scale=mix(2.75,.96,n); x=mix(959,801,n); y=mix(421,490,n); }
  if(reducedMotion) { scale=.96; x=801; y=490; }
  const tx=800-x*scale, ty=450-y*scale;
  $('rig').style.transform=`translate(${tx}px,${ty}px) scale(${scale})`;
  $('rig').style.filter=t>=7&&t<19?'contrast(1.03) saturate(1.04) brightness(1.08)':'contrast(1) saturate(.88) brightness(1.05)';
  $('foreground').setAttribute('transform',`translate(${(scale-1)*-16} 0)`);
  $('fire').style.opacity=started ? mix(.14,1,ease((t-7)/1.2)) : .8;
  $('thaw').style.opacity=ease((t-19)/6);
  $('credits').style.opacity=started ? ease((t-26)/1.5) : 0;
  $('seek').value=t;
  $('time').textContent=`00:${String(Math.floor(t)).padStart(2,'0')} / 00:30`;
}
function setPlaying(value) {
  playing=value;
  if(value) { started=true; document.body.classList.add('playing'); $('opening').inert=true; }
  document.body.classList.toggle('paused',!value);
  $('play').textContent=value?'Pause':'Play';
  $('play').setAttribute('aria-label',value?'Pause film':'Play film');
  if(master && audio) master.gain.setTargetAtTime(value&&soundOn?.12:0,audio.currentTime,1);
  render(position);
}
$('begin').addEventListener('click',()=>{ position=0; setPlaying(true); $('play').focus(); });
$('play').addEventListener('click',()=>setPlaying(!playing));
$('restart').addEventListener('click',()=>{position=0;setPlaying(true);});
$('seek').addEventListener('input',e=>{position=Number(e.target.value);render(position);});
document.addEventListener('keydown',e=>{
  if(e.code==='Space' && (e.target===document.body || e.target===$('scene'))) {e.preventDefault();setPlaying(!playing);}
});
const canvas=$('snow'), ctx=canvas.getContext('2d');
let w=0,h=0,dpr=1,iceColor,emberColor;
const flakes=Array.from({length:150},()=>({x:Math.random(),y:Math.random(),z:Math.random(),phase:Math.random()*6.28}));
function resize() {
  const rect=$('film').getBoundingClientRect(); w=rect.width;h=rect.height;dpr=Math.min(devicePixelRatio||1,2);
  canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);
  const style=getComputedStyle(document.documentElement);
  iceColor=style.getPropertyValue('--cp-snow').trim();emberColor=style.getPropertyValue('--cp-ember').trim();
}
resize();addEventListener('resize',resize);
function drawSnow(dt) {
  ctx.clearRect(0,0,w,h);
  for(const f of flakes) {
    if(playing&&!reducedMotion) {
      f.y=(f.y+dt*(.009+f.z*.026))%1;
      f.x=(f.x-dt*(.004+f.z*.012)+1)%1;
    }
    const x=f.x*w+Math.sin(position*.4+f.phase)*f.z*9,y=f.y*h;
    ctx.globalAlpha=.12+f.z*.44;
    ctx.fillStyle=Math.hypot(x/w-.61,y/h-.51)<.07?emberColor:iceColor;
    ctx.beginPath();ctx.ellipse(x,y,.35+f.z*1.2,.45+f.z*1.8,-.3,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
}
let audio,master,soundOn=false;
function createAudio() {
  const AudioEngine=window.AudioContext||window.webkitAudioContext;
  if(!AudioEngine) throw new Error('Web Audio is unavailable in this browser.');
  audio=new AudioEngine();master=audio.createGain();master.gain.value=0;master.connect(audio.destination);
  for(const [frequency,level] of [[55,.25],[82.5,.12],[110,.07]]) {
    const oscillator=audio.createOscillator(), gain=audio.createGain();
    oscillator.type='sine';oscillator.frequency.value=frequency;gain.gain.value=level;
    oscillator.connect(gain);gain.connect(master);oscillator.start();
  }
  const buffer=audio.createBuffer(1,audio.sampleRate*6,audio.sampleRate);
  const data=buffer.getChannelData(0);for(let i=0;i<data.length;i++)data[i]=Math.random()*2-1;
  const noise=audio.createBufferSource(),lowpass=audio.createBiquadFilter(),gain=audio.createGain();
  noise.buffer=buffer;noise.loop=true;lowpass.type='lowpass';lowpass.frequency.value=800;lowpass.Q.value=.5;gain.gain.value=.17;
  noise.connect(lowpass);lowpass.connect(gain);gain.connect(master);noise.start();
}
$('sound').addEventListener('click',async()=>{
  try {
    if(!audio)createAudio();
    await audio.resume();soundOn=!soundOn;
    master.gain.cancelScheduledValues(audio.currentTime);
    master.gain.setValueAtTime(master.gain.value,audio.currentTime);
    master.gain.linearRampToValueAtTime(soundOn&&playing?.12:0,audio.currentTime+4);
    $('sound').textContent=soundOn?'Sound on':'Sound off';$('sound').setAttribute('aria-pressed',String(soundOn));
    $('notice').textContent='';
  } catch(error) {
    $('notice').textContent=`Sound could not start: ${error.message}`;
  }
});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&playing)setPlaying(false);});
function frame(now) {
  const dt=previous?Math.min((now-previous)/1000,.1):0;previous=now;
  if(playing){position=(position+dt)%30;render(position);}
  drawSnow(dt);requestAnimationFrame(frame);
}
render(0);requestAnimationFrame(frame);
</script>
</body>
</html>
