<style>

}
html[data-theme="dark"] {
  color-scheme: dark;
  --cp-bg: #3d3b3a;
  --cp-bg-elevated: #343231;
  --cp-surface: #292929;
  --cp-surface-soft: #2e2e2e;
  --cp-border: #474747;
  --cp-border-strong: #5f5f5f;
  --cp-text: #dedede;
  --cp-text-muted: #919191;
  --cp-text-soft: #b0b0b0;
  --cp-accent: #fd8ea1;
  --cp-accent-hover: #fb7b91;
  --cp-accent-soft: rgba(253, 142, 161, 0.14);
  --cp-accent-fg: #1a1a1a;
  --cp-success: #4ade80;
  --cp-danger: #f87171;
  --cp-warning: #fbbf24;
  --cp-link: #4da6ff;
  --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.32);

}
:root {
  --cp-ink: light-dark(var(--cp-text), var(--cp-accent-fg));

  --cp-straw: color-mix(in srgb, var(--cp-warning) 26%, var(--cp-paper));
  --cp-earth: color-mix(in srgb, var(--cp-warning) 22%, var(--cp-ink));
  --cp-rust: color-mix(in srgb, var(--cp-accent) 24%, var(--cp-earth));
  --cp-shadow-field: color-mix(in srgb, var(--cp-earth) 80%, var(--cp-link));
  --cp-sky: color-mix(in srgb, var(--cp-link) 18%, var(--cp-paper));
  --cp-haze: color-mix(in srgb, var(--cp-straw) 58%, var(--cp-sky));
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--cp-ink); color: var(--cp-paper); font-family: "Segoe UI", Aptos, Calibri, sans-serif; overflow: hidden; }
button { font: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--cp-accent); outline-offset: 5px; }

.controls button:hover { background: color-mix(in srgb, var(--cp-paper) 12%, transparent); }
.controls button:disabled { opacity: .4; cursor: default; }
.time { font-size: 10px; font-variant-numeric: tabular-nums; opacity: .6; min-width: 60px; }
.progress { position: absolute; bottom: 12vh; left: 0; height: 2px; width: 100%; background: color-mix(in srgb, var(--cp-paper) 15%, transparent); }
.progress div { height: 100%; background: var(--cp-accent); transform-origin: left; transform: scaleX(0); }
.stalk-sway { transform-box: fill-box; transform-origin: 50% 100%; animation: sway 4.7s ease-in-out infinite alternate; }
.husk-tip { transform-box: fill-box; transform-origin: left bottom; animation: flutter 3.3s ease-in-out infinite alternate; }
.chaff { animation: float 9s linear infinite; }
@keyframes sway { from { transform: skewX(-1.2deg); } to { transform: skewX(1.6deg); } }
@keyframes flutter { from { transform: rotate(-2deg); } to { transform: rotate(5deg); } }
@keyframes float { from { transform: translate(-18px, 12px); opacity: 0; } 20%, 70% { opacity: .65; } to { transform: translate(120px, -36px); opacity: 0; } }
body.paused .stalk-sway, body.paused .husk-tip, body.paused .chaff { animation-play-state: paused; }
.porch { opacity: var(--lamp, 0); }
.definitions { position: absolute; width: 0; height: 0; overflow: hidden; }
#status { position: absolute; left: 5%; bottom: 12vh; font-size: 12px; background: var(--cp-ink); }
@media (max-width: 600px) {
  .film { inset: 6vh 0 18vh; }
  footer { height: 18vh; padding: 12px 6%; flex-wrap: wrap; align-content: center; gap: 16px; }
  .film-name { font-size: 16px; }
  .film-name span { display: inline; margin-left: 12px; font-size: 8px; }
  .controls { width: 100%; justify-content: space-between; gap: 5px; }
  .controls button { font-size: 11px; padding: 9px; }
  .progress, #status { bottom: 18vh; }
  .heading { top: 12%; }
  h1 { font-size: 55px; }
  .credit { top: 9%; right: 7%; }
}
@media (prefers-reduced-motion: reduce) {
  .stalk-sway, .husk-tip, .chaff { animation: none; }
}

<script>
(() => {
  "use strict";
  const ns = "http://www.w3.org/2000/svg";
  let seed = 729;
  const random = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
  const add = (parent, tag, attrs) => {
    const node = document.createElementNS(ns, tag);
    for (const [key, value] of Object.entries(attrs)) node.setAttribute(key, value);
    parent.appendChild(node);
    return node;
  };
  const byId = id => document.getElementById(id);
  for (let i = 0; i < 105; i++) {
    const x = -100 + i * 18, y = 467, height = 9 + random() * 22;
    let crown = `M${x - 15} ${y + 7}`;
    for (let j = 0; j <= 12; j++) {
      const offset = -16 + j * 2.7;
      crown += `L${x + offset} ${y - Math.sin(j / 12 * Math.PI) * height - random() * 4}`;
    }
    crown += `L${x + 17} ${y + 8}Z`;
    add(byId("windbreak"), "path", { d: crown });
  }
  for (let i = 0; i < 100; i++) {
    const x = -1500 + i * 40;
    add(byId("field-rows"), "path", { d: `M${620 + (x - 620) * .12} 506 Q${x * .6} 640 ${x} 1000`, fill: "none", stroke: "var(--cp-earth)", "stroke-width": 1 + random() * 3, opacity: .13 + random() * .15 });
  }
  for (let i = 0; i < 460; i++) {
    const x = random() * 2100 - 250, y = 520 + random() * 440;
    if (x > 900 && x < 1120) continue;
    add(byId("stubble"), "path", { d: `M${x} ${y} l${random() * 9 - 4} ${-3 - (y - 510) * .055}` });
  }
  for (const [id, count, baseline, scale] of [["corn-mid", 112, 690, .65], ["corn-near", 48, 850, 1.18]]) {
    for (let i = 0; i < count; i++) {
      const x = -180 + i * (1940 / count) + random() * 18;
      if (x > (id === "corn-mid" ? 870 : 790) && x < 1170) continue;
      const s = scale * (.72 + random() * .36);
      add(byId(id), "use", { href: "#corn", transform: `translate(${x} ${baseline + random() * 42}) scale(${s}) rotate(${random() * 12 - 6})`, opacity: id === "corn-mid" ? .65 : .91 });
    }
  }
  for (let i = 0; i < 20; i++) {
    add(byId("motes"), "ellipse", { class: "chaff", cx: 120 + random() * 1320, cy: 470 + random() * 220, rx: 1 + random() * 2, ry: .6, style: `animation-delay:-${random() * 9}s;animation-duration:${8 + random() * 7}s` });
  }
  const shots = [...document.querySelectorAll(".shot")];
  const rigs = shots.map(shot => shot.querySelector(".rig"));
  const reduced = matchMedia("(prefers-reduced-motion: reduce)");
  let elapsed = 0, last = 0, running = false, started = false, current = -1;
  let context, master, audioOn = false;
  const smooth = x => x * x * (3 - 2 * x);
  // 0-8s: follow the lane; foreground separates faster than the distant farm as the wind opens a gap.
  // 8-15s: locked close-up; the papery husk, not another camera move, carries the memory.
  // 15-23s: locked homeward view; the porch lamp coming on turns landscape into belonging.
  // 23-32s: pull back; a mailbox and fence disclose that we have been standing at the road home.
  function render() {
    const t = elapsed;
    const index = t < 8 ? 0 : t < 15 ? 1 : t < 23 ? 2 : 3;
    if (index !== current) {
      shots.forEach((shot, i) => { shot.classList.toggle("active", i === index); shot.setAttribute("aria-hidden", String(i !== index)); });
      current = index;
    }
    rigs[0].style.transform = reduced.matches ? "none" : `scale(${1 + .065 * smooth(Math.min(t / 8, 1))})`;
    rigs[0].style.transformOrigin = "68% 60%";
    rigs[0].style.filter = "contrast(1.02) saturate(.86) brightness(1.04)";
    rigs[1].style.filter = "contrast(1.06) saturate(.82) brightness(1.06)";
    rigs[2].style.filter = "contrast(1.03) saturate(.78) brightness(1.02)";
    rigs[3].style.filter = "contrast(1.02) saturate(.86) brightness(1.03)";
    rigs[3].style.transformOrigin = "66% 43%";
    rigs[3].style.transform = reduced.matches ? "none" : `scale(${1.42 - .42 * smooth(Math.max(0, Math.min((t - 23) / 7, 1)))})`;
    document.documentElement.style.setProperty("--lamp", smooth(Math.max(0, Math.min((t - 17) / 2, 1))));
    const heading = document.querySelector(".heading");
    heading.style.opacity = !started ? 1 : Math.max(0, 1 - t / 3);
    heading.setAttribute("aria-hidden", String(started && t >= 3));
    byId("caption").textContent = index === 1 ? "The sound of October." : index === 2 ? "Someone always left a light on." : "";
    const local = index === 1 ? t - 8 : t - 15;
    byId("caption").style.opacity = index === 1 || index === 2 ? Math.min(1, local / 1.3, ((index === 1 ? 15 : 23) - t) / 1.2) : 0;
    document.querySelector(".credit").style.opacity = Math.max(0, Math.min((t - 28) / 1.5, 1));
    document.querySelector(".credit").setAttribute("aria-hidden", String(t < 28));
    document.querySelector(".progress div").style.transform = `scaleX(${t / 32})`;
    document.querySelector(".progress").setAttribute("aria-valuenow", Math.floor(t));
    document.querySelector(".time").textContent = `${String(Math.floor(t)).padStart(2, "0")} / 32`;
  }
  function frame(now) {
    if (running) {
      elapsed = (elapsed + (now - last) / 1000) % 32;
      render();
    }
    last = now;
    requestAnimationFrame(frame);
  }
  function setRunning(value) {
    running = value;
    last = performance.now();
    document.body.classList.toggle("paused", !value);
    byId("play").textContent = value ? "Pause" : "Play";
    if (context && master) {
      master.gain.cancelScheduledValues(context.currentTime);
      master.gain.setTargetAtTime(value && audioOn ? .12 : 0, context.currentTime, .3);
    }
  }
  function createAudio() {
    const Audio = window.AudioContext || window.webkitAudioContext;
    if (!Audio) throw new Error("Web Audio is not supported in this browser.");
    context = new Audio();
    master = context.createGain();
    master.gain.value = 0;
    master.connect(context.destination);
    const buffer = context.createBuffer(1, context.sampleRate * 8, context.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
    const wind = context.createBufferSource();
    wind.buffer = buffer; wind.loop = true;
    const low = context.createBiquadFilter();
    low.type = "lowpass"; low.frequency.value = 800; low.Q.value = .45;
    const breeze = context.createGain(); breeze.gain.value = .45;
    wind.connect(low).connect(breeze).connect(master); wind.start();
    const wave = context.createOscillator(), depth = context.createGain();
    wave.frequency.value = .13; depth.gain.value = .11;
    wave.connect(depth).connect(breeze.gain); wave.start();
    [130.81, 196.215, 261.62].forEach((frequency, i) => {
      const note = context.createOscillator(), gain = context.createGain();
      note.type = "sine"; note.frequency.value = frequency;
      gain.gain.value = [.07, .035, .025][i];
      note.connect(gain).connect(master); note.start();
    });
  }
  async function toggleSound() {
    try {
      if (!context) createAudio();
      await context.resume();
      audioOn = !audioOn;
      master.gain.cancelScheduledValues(context.currentTime);
      master.gain.setValueAtTime(master.gain.value, context.currentTime);
      master.gain.linearRampToValueAtTime(audioOn && running ? .12 : 0, context.currentTime + (audioOn ? 4 : .6));
      byId("sound").textContent = audioOn ? "Sound on" : "Sound off";
      byId("sound").setAttribute("aria-pressed", String(audioOn));
      byId("status").textContent = "";
    } catch (error) {
      byId("status").textContent = `Sound unavailable: ${error.message}. The film can play silently.`;
    }
  }
  byId("enter").addEventListener("click", () => {
    started = true; byId("enter").hidden = true;
    byId("play").disabled = false; byId("replay").disabled = false;
    setRunning(true); render();
  });
  byId("play").addEventListener("click", () => setRunning(!running));
  byId("sound").addEventListener("click", toggleSound);
  byId("replay").addEventListener("click", () => { elapsed = 0; setRunning(true); render(); });
  document.addEventListener("visibilitychange", () => { if (document.hidden && running) setRunning(false); });
  render(); requestAnimationFrame(frame);
})();
</script>
</body>
